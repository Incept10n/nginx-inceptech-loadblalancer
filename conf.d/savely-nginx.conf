server {
    listen 80;
    server_name savely.inceptech.ru;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name savely.inceptech.ru;

    ssl_certificate     /etc/nginx/certs/savely/tls.crt;
    ssl_certificate_key /etc/nginx/certs/savely/tls.key;

    location /api/ {
        proxy_pass http://backend.savely.svc.cluster.local:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        client_max_body_size 10M;
    }

    location / {
        proxy_pass http://frontend.savely.svc.cluster.local:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
