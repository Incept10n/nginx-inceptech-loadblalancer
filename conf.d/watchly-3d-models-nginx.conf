server {
    listen 80;
    server_name dev.watchly.inceptech.ru;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dev.watchly.inceptech.ru;
    
    ssl_certificate     /etc/nginx/certs/dev-watchly-inceptech-ru/tls.crt;
    ssl_certificate_key /etc/nginx/certs/dev-watchly-inceptech-ru/tls.key;

    location /api/ {
    proxy_pass http://backend.watchly-3d-models.svc.cluster.local:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 60s;
    client_max_body_size 10M;
}

    location / {
        proxy_pass http://frontend.watchly-3d-models.svc.cluster.local:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
