server {
    listen 80;
    server_name s3.inceptech.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name s3.inceptech.ru;

    ssl_certificate     /etc/nginx/certs/s3/tls.crt;
    ssl_certificate_key /etc/nginx/certs/s3/tls.key;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # S3 API
    location / {
        proxy_pass http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin UI
    location /admin/ {
        proxy_pass http://seaweedfs-admin.seaweedfs.svc.cluster.local:12535/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
